<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELA Pipeline Dashboard - AXIOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="app" class="min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <div class="mb-8">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">IELA Pipeline Dashboard</h1>
            <p class="text-gray-600">Ingest → Enrich → Analyze → List</p>
          </div>
          <div class="flex gap-3">
            <button onclick="window.location.href='/admin-iela-intake.html'" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
              New Deal Intake
            </button>
            <button onclick="window.location.href='/admin'" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50">
              ← Back to Admin
            </button>
          </div>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
          <p class="text-sm text-gray-600 mb-1">Total Deals</p>
          <p class="text-2xl font-bold text-gray-900" id="stat-total">0</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
          <p class="text-sm text-gray-600 mb-1">Draft</p>
          <p class="text-2xl font-bold text-yellow-600" id="stat-draft">0</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
          <p class="text-sm text-gray-600 mb-1">Listed (Investor)</p>
          <p class="text-2xl font-bold text-green-600" id="stat-investor">0</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
          <p class="text-sm text-gray-600 mb-1">Listed (RTO)</p>
          <p class="text-2xl font-bold text-purple-600" id="stat-rto">0</p>
        </div>
      </div>

      <!-- Filters & Search -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <input
            type="text"
            id="search"
            placeholder="Search address, city..."
            class="px-3 py-2 border border-gray-300 rounded-md"
            onkeyup="filterDeals()"
          />
          <select id="statusFilter" onchange="filterDeals()" class="px-3 py-2 border border-gray-300 rounded-md">
            <option value="">All Statuses</option>
            <option value="draft">Draft</option>
            <option value="suppressed">Suppressed</option>
            <option value="listed_investor">Listed (Investor)</option>
            <option value="listed_rto">Listed (RTO)</option>
          </select>
          <button onclick="loadDeals()" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">
            Refresh
          </button>
        </div>
      </div>

      <!-- Deals Table -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-200">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Property</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pricing</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Analysis</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="deals-table" class="bg-white divide-y divide-gray-200">
              <tr>
                <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                  Loading deals...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allDeals = [];

    async function loadDeals() {
      try {
        const statusFilter = document.getElementById('statusFilter').value;
        const params = statusFilter ? `?status=${statusFilter}` : '';
        
        const response = await fetch(`/api/deals${params}`);
        const data = await response.json();
        
        if (data.success) {
          allDeals = data.data;
          updateStats();
          renderDeals(allDeals);
        }
      } catch (error) {
        console.error('Failed to load deals:', error);
        document.getElementById('deals-table').innerHTML = `
          <tr>
            <td colspan="5" class="px-6 py-12 text-center text-red-500">
              Failed to load deals. Is IELA enabled?
            </td>
          </tr>
        `;
      }
    }

    function updateStats() {
      const stats = {
        total: allDeals.length,
        draft: allDeals.filter(d => d.status === 'draft').length,
        investor: allDeals.filter(d => d.status === 'listed_investor').length,
        rto: allDeals.filter(d => d.status === 'listed_rto').length
      };

      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-draft').textContent = stats.draft;
      document.getElementById('stat-investor').textContent = stats.investor;
      document.getElementById('stat-rto').textContent = stats.rto;
    }

    function filterDeals() {
      const search = document.getElementById('search').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      let filtered = allDeals;

      if (statusFilter) {
        filtered = filtered.filter(d => d.status === statusFilter);
      }

      if (search) {
        filtered = filtered.filter(d => {
          return (d.parsed?.address?.toLowerCase().includes(search) ||
                  d.parsed?.city?.toLowerCase().includes(search) ||
                  d.parsed?.state?.toLowerCase().includes(search) ||
                  d.id.toLowerCase().includes(search));
        });
      }

      renderDeals(filtered);
    }

    function renderDeals(deals) {
      const tbody = document.getElementById('deals-table');

      if (deals.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="px-6 py-12 text-center text-gray-500">
              No deals found
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = deals.map(deal => `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4">
            <div class="text-sm font-medium text-gray-900">${deal.parsed?.address || 'No address'}</div>
            <div class="text-sm text-gray-500">${deal.parsed?.city || ''}, ${deal.parsed?.state || ''} ${deal.parsed?.zip || ''}</div>
            <div class="text-xs text-gray-400 mt-1">${deal.id}</div>
          </td>
          <td class="px-6 py-4">
            <div class="text-sm font-semibold text-green-600">${formatCurrency(deal.parsed?.asking)}</div>
            <div class="text-xs text-gray-500">ARV: ${formatCurrency(deal.parsed?.arv)}</div>
          </td>
          <td class="px-6 py-4">
            ${deal.analysis ? `
              <div class="text-sm font-medium text-gray-900">MAO: ${formatCurrency(deal.analysis.maoByRepair?.[1]?.mao)}</div>
              <div class="text-xs text-gray-500">Ratio: ${deal.analysis.priceToArvPctWithRepairs?.[1]?.pct?.toFixed(1)}%</div>
              ${deal.analysis.rtoBadge ? `
                <span class="inline-block mt-1 px-2 py-1 text-xs font-medium rounded ${getBadgeColor(deal.analysis.rtoBadge)}">
                  ${deal.analysis.rtoBadge === 'green' ? '🟢' : deal.analysis.rtoBadge === 'yellow' ? '🟡' : '🔴'} ${deal.analysis.rtoBadge}
                </span>
              ` : ''}
            ` : `
              <button onclick="analyzeDeal('${deal.id}')" class="text-sm text-blue-600 hover:text-blue-700">
                Run Analysis →
              </button>
            `}
          </td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 text-xs font-medium rounded ${getStatusColor(deal.status)}">
              ${deal.status}
            </span>
          </td>
          <td class="px-6 py-4">
            <div class="flex gap-2">
              ${!deal.analysis ? `
                <button onclick="analyzeDeal('${deal.id}')" class="text-sm text-blue-600 hover:text-blue-700">
                  Analyze
                </button>
              ` : deal.status === 'draft' ? `
                <button onclick="publishDeal('${deal.id}', 'investor')" class="text-sm text-green-600 hover:text-green-700">
                  Publish (Inv)
                </button>
                <button onclick="publishDeal('${deal.id}', 'rto')" class="text-sm text-purple-600 hover:text-purple-700">
                  Publish (RTO)
                </button>
              ` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function analyzeDeal(dealId) {
      try {
        const response = await fetch(`/api/deals/${dealId}/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        
        const data = await response.json();
        if (data.success) {
          await loadDeals();
        }
      } catch (error) {
        alert('Failed to analyze deal: ' + error.message);
      }
    }

    async function publishDeal(dealId, target) {
      if (!confirm(`Publish this deal for ${target}s?`)) return;

      try {
        const response = await fetch(`/api/deals/${dealId}/publish`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target })
        });
        
        const data = await response.json();
        if (data.success) {
          alert(`Deal published for ${target}s!`);
          await loadDeals();
        }
      } catch (error) {
        alert('Failed to publish deal: ' + error.message);
      }
    }

    function formatCurrency(value) {
      if (!value) return 'N/A';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0
      }).format(value);
    }

    function getStatusColor(status) {
      const colors = {
        draft: 'bg-gray-100 text-gray-800',
        suppressed: 'bg-red-100 text-red-800',
        listed_investor: 'bg-green-100 text-green-800',
        listed_rto: 'bg-purple-100 text-purple-800'
      };
      return colors[status] || 'bg-gray-100 text-gray-800';
    }

    function getBadgeColor(badge) {
      const colors = {
        green: 'bg-green-100 text-green-800',
        yellow: 'bg-yellow-100 text-yellow-800',
        red: 'bg-red-100 text-red-800'
      };
      return colors[badge] || 'bg-gray-100 text-gray-800';
    }

    // Load deals on page load
    loadDeals();
  </script>
</body>
</html>
