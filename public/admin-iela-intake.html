<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELA Deal Intake - AXIOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="mb-8">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">IELA Deal Intake</h1>
            <p class="text-gray-600">Paste SMS, email, or property details to automatically extract and analyze</p>
          </div>
          <button onclick="window.location.href='/admin-iela.html'" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50">
            ← Back to Dashboard
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Input Panel -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Deal Information</h2>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Source</label>
            <select id="source" class="w-full px-3 py-2 border border-gray-300 rounded-md">
              <option value="manual">Manual Entry</option>
              <option value="sms">SMS</option>
              <option value="email">Email</option>
              <option value="webhook">Webhook</option>
            </select>
          </div>

          <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-medium text-gray-700">Deal Text / Message</label>
              <button onclick="loadExample()" class="text-xs text-blue-600 hover:text-blue-700">
                Load Example
              </button>
            </div>
            <textarea
              id="rawText"
              rows="8"
              placeholder="Paste SMS message, email, or property details here..."
              class="w-full px-3 py-2 border border-gray-300 rounded-md font-mono text-sm"
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Listing URL (optional)</label>
            <input
              type="url"
              id="url"
              placeholder="https://investorlift.com/p/..."
              class="w-full px-3 py-2 border border-gray-300 rounded-md"
            />
          </div>

          <div id="error" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md hidden">
            <p class="text-sm text-red-800"></p>
          </div>

          <div class="flex gap-3">
            <button
              onclick="ingestDeal()"
              id="ingestBtn"
              class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
            >
              Ingest Deal
            </button>
            <button
              onclick="resetForm()"
              class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors"
            >
              Reset
            </button>
          </div>
        </div>

        <!-- Output Panel -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Parsed Data</h2>

          <div id="output-empty" class="text-center py-12 text-gray-400">
            <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p>No data yet</p>
            <p class="text-sm mt-1">Enter deal text and click "Ingest Deal"</p>
          </div>

          <div id="output-data" class="space-y-4 hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDeal = null;

    function loadExample() {
      document.getElementById('rawText').value = `Hi, Clarence. New off-market property in 247 Howell Drive Southwest, Atlanta, GA 30331 is available on Investorlift. Asking 103k. ARV 165k. Contact Charlie Martinez 323-701-0293 for more information.`;
      document.getElementById('url').value = 'https://investorlift.com/p/281467';
    }

    async function ingestDeal() {
      const rawText = document.getElementById('rawText').value.trim();
      const url = document.getElementById('url').value.trim();
      const source = document.getElementById('source').value;

      if (!rawText) {
        showError('Please enter deal text');
        return;
      }

      setLoading(true);
      hideError();

      try {
        const response = await fetch('/api/deals/ingest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source, rawText, url: url || undefined })
        });

        const data = await response.json();

        if (data.success) {
          currentDeal = data.data;
          displayDeal(currentDeal);
        } else {
          showError(data.error || 'Failed to ingest deal');
        }
      } catch (err) {
        showError('Network error: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    async function analyzeDeal() {
      if (!currentDeal) return;

      setLoading(true);
      try {
        const response = await fetch(`/api/deals/${currentDeal.id}/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });

        const data = await response.json();
        if (data.success) {
          currentDeal = data.data;
          displayDeal(currentDeal);
        }
      } catch (err) {
        showError('Analysis failed: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    function displayDeal(deal) {
      document.getElementById('output-empty').classList.add('hidden');
      const output = document.getElementById('output-data');
      output.classList.remove('hidden');

      output.innerHTML = `
        <!-- Property Info -->
        <div class="border-b border-gray-200 pb-4">
          <h3 class="text-sm font-semibold text-gray-700 mb-3">Property</h3>
          <div class="space-y-2">
            <div>
              <p class="text-xs text-gray-500">Address</p>
              <p class="text-sm font-medium text-gray-900">${deal.parsed?.address || 'Not found'}</p>
            </div>
            <div>
              <p class="text-xs text-gray-500">Location</p>
              <p class="text-sm font-medium text-gray-900">${deal.parsed?.city}, ${deal.parsed?.state} ${deal.parsed?.zip}</p>
            </div>
          </div>
        </div>

        <!-- Pricing -->
        <div class="border-b border-gray-200 pb-4">
          <h3 class="text-sm font-semibold text-gray-700 mb-3">Pricing</h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="text-xs text-gray-500">Asking Price</p>
              <p class="text-lg font-bold text-green-600">${formatCurrency(deal.parsed?.asking)}</p>
            </div>
            <div>
              <p class="text-xs text-gray-500">ARV</p>
              <p class="text-lg font-bold text-blue-600">${formatCurrency(deal.parsed?.arv)}</p>
            </div>
          </div>
        </div>

        <!-- Contact -->
        ${deal.parsed?.contactName ? `
        <div class="border-b border-gray-200 pb-4">
          <h3 class="text-sm font-semibold text-gray-700 mb-3">Contact</h3>
          <div class="space-y-1">
            <p class="text-sm font-medium text-gray-900">${deal.parsed.contactName}</p>
            <p class="text-sm text-gray-600">${deal.parsed.contactPhone || ''}</p>
            ${deal.parsed.contactEmail ? `<p class="text-sm text-gray-600">${deal.parsed.contactEmail}</p>` : ''}
          </div>
        </div>
        ` : ''}

        <!-- Analysis -->
        ${deal.analysis ? `
        <div class="border-b border-gray-200 pb-4">
          <h3 class="text-sm font-semibold text-gray-700 mb-3">Analysis</h3>
          <div class="space-y-3">
            <div>
              <p class="text-xs text-gray-500 mb-1">MAO (Mid Repair)</p>
              <p class="text-xl font-bold text-gray-900">${formatCurrency(deal.analysis.maoByRepair?.[1]?.mao)}</p>
              <p class="text-xs text-gray-600">vs Asking: ${formatCurrency((deal.analysis.maoByRepair?.[1]?.mao || 0) - (deal.parsed.asking || 0))}</p>
            </div>
            <div>
              <p class="text-xs text-gray-500 mb-1">Price-to-ARV Ratio</p>
              <p class="text-lg font-semibold text-gray-900">${deal.analysis.priceToArvPctWithRepairs?.[1]?.pct.toFixed(1)}%</p>
            </div>
            ${deal.analysis.rtoBadge ? `
            <div>
              <p class="text-xs text-gray-500 mb-1">RTO Suitability</p>
              <span class="inline-block px-2 py-1 text-xs font-medium rounded ${getBadgeColor(deal.analysis.rtoBadge)}">
                ${deal.analysis.rtoBadge === 'green' ? '🟢 Excellent' :
                  deal.analysis.rtoBadge === 'yellow' ? '🟡 Moderate' :
                  '🔴 Challenging'}
              </span>
            </div>
            ` : ''}
          </div>
        </div>
        ` : `
        <div class="pb-4">
          <button onclick="analyzeDeal()" class="w-full px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 transition-colors">
            Run Analysis
          </button>
        </div>
        `}

        <!-- Deal ID -->
        <div class="pt-2">
          <p class="text-xs text-gray-500">Deal ID</p>
          <p class="text-xs font-mono text-gray-600">${deal.id}</p>
        </div>

        <!-- View Dashboard -->
        <div class="pt-4">
          <button onclick="window.location.href='/admin-iela.html'" class="w-full px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors">
            View in Dashboard →
          </button>
        </div>
      `;
    }

    function resetForm() {
      document.getElementById('rawText').value = '';
      document.getElementById('url').value = '';
      document.getElementById('source').value = 'manual';
      currentDeal = null;
      document.getElementById('output-data').classList.add('hidden');
      document.getElementById('output-empty').classList.remove('hidden');
      hideError();
    }

    function setLoading(loading) {
      const btn = document.getElementById('ingestBtn');
      btn.disabled = loading;
      btn.textContent = loading ? 'Processing...' : 'Ingest Deal';
    }

    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.querySelector('p').textContent = message;
      errorDiv.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error').classList.add('hidden');
    }

    function formatCurrency(value) {
      if (!value) return 'N/A';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0
      }).format(value);
    }

    function getBadgeColor(badge) {
      const colors = {
        green: 'bg-green-100 text-green-800',
        yellow: 'bg-yellow-100 text-yellow-800',
        red: 'bg-red-100 text-red-800'
      };
      return colors[badge] || 'bg-gray-100 text-gray-800';
    }
  </script>
</body>
</html>
